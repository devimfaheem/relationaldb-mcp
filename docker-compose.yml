# Demo stack: the MCP server plus sample MySQL and PostgreSQL databases.
#   cp .env.example .env   # then fill in API_KEY and SECRET_KEY (admin login starts as admin/admin)
#   docker compose up --build
# Add SQL Server too with:  docker compose --profile mssql up --build
services:
  sqlmcp:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./examples/data:/data
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./examples/sql/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot_password"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: shop
    volumes:
      - ./examples/sql/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  mssql:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Sa_password123
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Sa_password123 -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 30

  mssql-init:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./examples/sql/mssql-init.sql:/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "mssql", "-U", "sa", "-P", "Sa_password123", "-i", "/init.sql"]
    restart: "no"
